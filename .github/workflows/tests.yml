name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.2', '7.3', '7.4', '8.0']
        dependency-version: [prefer-lowest, prefer-stable]
        exclude:
          # PHPUnit 5.7 minimum uses each() which was removed in PHP 8.0
          - php: '8.0'
            dependency-version: prefer-lowest

    name: PHP ${{ matrix.php }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch sunrise artifact packages
        uses: actions/checkout@v6
        with:
          repository: comfino/shop-plugins-lib-builder
          token: ${{ secrets.LIB_BUILDER_TOKEN }}
          sparse-checkout: packages/sunrise
          sparse-checkout-cone-mode: false
          path: .sunrise-checkout

      - name: Stage sunrise zips
        run: |
          mkdir -p packages
          mv .sunrise-checkout/packages/sunrise packages/sunrise
          rm -rf .sunrise-checkout
          ls -la packages/sunrise

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.dependency-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.dependency-version }}-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.LIB_BUILDER_TOKEN }}"}}'
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Create writable log and cache directories
        run: mkdir -p var/log var/cache

      - name: Check autoloader
        run: php -r "require 'vendor/autoload.php'; echo 'Autoloader OK' . PHP_EOL;"

      - name: Smoke-test ApiClient::getInstance()
        run: |
          set +e
          exec 2>&1
          cat > /tmp/smoke.php <<'PHP'
          <?php
          ini_set('display_errors', '1');
          ini_set('display_startup_errors', '1');
          error_reporting(E_ALL);

          set_error_handler(function ($errno, $errstr, $errfile, $errline) {
              fwrite(STDOUT, "[error_handler] $errno $errstr in $errfile:$errline\n");
              return false;
          });
          set_exception_handler(function ($e) {
              fwrite(STDOUT, "[exception_handler] " . get_class($e) . ": " . $e->getMessage()
                  . " in " . $e->getFile() . ":" . $e->getLine() . "\n" . $e->getTraceAsString() . "\n");
          });
          register_shutdown_function(function () {
              $err = error_get_last();
              if ($err !== null) {
                  fwrite(STDOUT, "[shutdown last_error] " . print_r($err, true) . "\n");
              } else {
                  fwrite(STDOUT, "[shutdown] no last_error\n");
              }
          });

          require getcwd() . '/tests/bootstrap.php';
          // bootstrap.php resets error_reporting; force back to E_ALL.
          error_reporting(E_ALL);
          fwrite(STDOUT, "Bootstrap loaded\n");

          try {
              $c = \Comfino\Api\ApiClient::getInstance();
              fwrite(STDOUT, "getInstance OK: " . get_class($c) . "\n");
          } catch (\Throwable $t) {
              fwrite(STDOUT, "[caught] " . get_class($t) . ": " . $t->getMessage()
                  . " in " . $t->getFile() . ":" . $t->getLine() . "\n" . $t->getTraceAsString() . "\n");
          }
          PHP
          php -d output_buffering=0 -d implicit_flush=1 -d memory_limit=512M /tmp/smoke.php
          status=$?
          echo "::notice::smoke exit = $status"
          exit 0

      - name: Run tests
        run: |
          set +e
          # Merge stderr into stdout so fatals interleave with PHPUnit's --debug
          # "Starting test 'X'" lines, pinpointing the offending test.
          exec 2>&1
          php \
            -d error_reporting=-1 \
            -d display_errors=On \
            -d display_startup_errors=On \
            -d log_errors=On \
            -d output_buffering=0 \
            -d implicit_flush=1 \
            -d zend.assertions=1 \
            vendor/bin/phpunit --debug --verbose --stderr
          status=$?
          echo "::notice::phpunit exit code = $status"
          exit $status

  coverage:
    runs-on: ubuntu-latest

    name: Code Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch sunrise artifact packages
        uses: actions/checkout@v6
        with:
          repository: comfino/shop-plugins-lib-builder
          token: ${{ secrets.LIB_BUILDER_TOKEN }}
          sparse-checkout: packages/sunrise
          sparse-checkout-cone-mode: false
          path: .sunrise-checkout

      - name: Stage sunrise zips
        run: |
          mkdir -p packages
          mv .sunrise-checkout/packages/sunrise packages/sunrise
          rm -rf .sunrise-checkout
          ls -la packages/sunrise

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          extensions: curl, json, zlib
          coverage: xdebug

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.LIB_BUILDER_TOKEN }}"}}'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Create writable log and cache directories
        run: mkdir -p var/log var/cache

      - name: Run tests with coverage
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover coverage.xml --coverage-html coverage --coverage-text

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}